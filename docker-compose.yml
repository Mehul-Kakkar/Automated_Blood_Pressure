services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bp_app
      POSTGRES_USER: bp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bp_user -d bp_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://bp_user:${POSTGRES_PASSWORD}@postgres:5432/bp_app
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
      MQTT_ENABLED: ${MQTT_ENABLED:-false}
      MQTT_LEGACY_TOPIC_COMPATIBILITY: ${MQTT_LEGACY_TOPIC_COMPATIBILITY:-false}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-k7128701.ala.asia-southeast1.emqxsl.com}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-8883}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-true}
      MQTT_USERNAME: ${MQTT_USERNAME:-bp_backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_CA_CERT_PATH: ${MQTT_CA_CERT_PATH:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-bp_backend_local}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
    volumes:
      - ./certs:/run/mqtt-ca:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
